<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html_canvas_3d</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="menu">
      <h1>3D Canvas Demos</h1>

      <button id="demo2">Demo 2 - Rotating Boxes</button>
      <button id="demo3">Demo 3 - Rubrik Cube</button>
      <button id="demo4">Demo 4 - Jerusalem Cube</button>
      <button id="demo5">Demo 5 - Sphere</button>
      <button id="demo6">Demo 6 - Circle</button>
      <button id="demo7">Demo 7 - Cones</button>
      <button id="demo8">Demo 8 - Cylinders</button>
      <button id="demo9">Demo 9 - Arrows</button>
      <button id="demo10">Demo 10 - Perlin Noise</button>
      <button id="demo11">Demo 11 - Connected Pipes</button>
      <button id="demo12">Demo 12 - Flying Saucer</button>
      <button id="demo13">Demo 13 - Tire</button>
      <button id="demo14">Demo 14 - Toboggans</button>
      <label for="render-normals-checkbox">
        <input
          type="checkbox"
          id="render-normals-checkbox"
          autocomplete="off"
        />
        Show normals
      </label>
    </div>
    <div id="canvas-container">
      <canvas id="animation" width="850" height="850"></canvas>
    </div>
    <script type="module" src="/src/home.js"></script>
  </body>
</html>
